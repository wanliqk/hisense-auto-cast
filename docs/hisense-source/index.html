<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <!-- title -->
    <title>电脑投屏</title>
    <!-- meta -->
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta charset="utf-8">
    <!-- css -->
    <link type="text/css" rel="stylesheet" href="./css/bootstrap.min.css">
    <link type="text/css" rel="stylesheet" href="./css/mirror.css">
    <!-- script -->
    <script type="text/javascript" src="./js/jquery.min.js"></script>
    <script type="text/javascript" src="./js/bootstrap.min.js"></script>
    <script type="text/javascript" src="./js/state-machine.min.js"></script>
    <script type="text/javascript" src="./js/lottie.min.js"></script>
    <script type="text/javascript" src="./js/ua-parser.min.js"></script>
    <script type="text/javascript" src="./js/document-state.js"></script>
    <script type="text/javascript" src="./js/webmirror.js"></script>
    <!-- HTML5 Shiv 和 Respond.js 用于让 IE8 支持 HTML5元素和媒体查询 -->
    <!-- 注意： 如果通过 file://  引入 Respond.js 文件，则该文件无法起效果 -->
    <!--[if lt IE 9]>
			<script src="https://oss.maxcdn.com/libs/html5shiv/3.7.0/html5shiv.js"></script>
			<script src="https://oss.maxcdn.com/libs/respond.js/1.3.0/respond.min.js"></script>
	<![endif]-->
</head>


<body>

    <!-- Mirror -->
    <div class="container" id="mirror" style="display: none;">
        <div class="container-mirror">
            <!-- type -->
            <div class="container-type">
                <img id="state-type" src="./images/pic_device_1.png" alt="">
            </div>
            <!-- state -->
            <div class="container-state" id="image" style="visibility:visible;">
                <img id="state-image" src="./images/pic_point_start.png" alt="">
            </div>
            <div class="container-state" id="lottie" style="visibility:hidden;">
            </div>
            <!-- content -->
            <div class="content">
                <p id="state-title"></p>
                <div id="state-ready" style="display:none;">
                    <div class="button-container">
                        <button class="primary" type="button" onclick="startCast()">开始</button>
                    </div>
                </div>
                <div id="state-sharing" style="display:none;">
                    <div class="button-container">
                        <button class="normal" type="button" onclick="stopShare()">停止共享屏幕</button>
                    </div>
                </div>
                <div id="state-disconnect" style="display:none;">
                    <div class="button-container">
                        <button class="primary" type="button" onclick="startCast()">重新共享屏幕</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Dialog -->
    <div id="popup" style="display: none;">
        <div id="mirror-dialog">
            <div class="dialog-container">
                <div class="dialog-header">
                    <p>退出</p>
                    <img onclick="dialogCancel()" src="./images/ic_popup_close.png" alt="">
                </div>
                <div class="dialog-content">
                    <p>是否退出电脑屏幕共享</p>
                </div>
                <div class="dialog-footer">
                    <button id="dialog-cancel" class="normal" onclick="dialogCancel()">取消</button>
                    <button id="dialog-confirm" class="primary" onclick="dialogConfirm()">确定</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Support Browser -->
    <div class="container-support" id="support">
        <div class="support-header">
            <p class="title">该浏览器不支持电脑投电视功能</p>
            <p class="subtitle">请使用谷歌Chrome或微软Edge浏览器打开</p>
        </div>
        <div class="support-content">
            <div class="browser-container">
                <img src="./images/chrome.png" alt="谷歌Chrome浏览器">
                <p class="text">谷歌Chrome浏览器</p>
                <p class="note">支持版本74以上</p>
            </div>
            <div class="browser-container">
                <img src="./images/ic_microsoft_edge.png" alt="微软Edge浏览器">
                <p class="text">微软Edge浏览器</p>
                <p class="note">支持版本79以上</p>
            </div>
        </div>
    </div>

</body>


<script type="text/javascript">

    if (WebMirrorUtil.isSupportMirror()) {
        document.getElementById('mirror').style.display = "block";
        document.getElementById('support').style.display = "none";

        var ds = new DocumentState();
        var host = document.domain;

        function startCast() {
            WebMirrorManager.getMirrorClient().startMirror(host, 8765);
            ds.connect();
        }

        function stopCast() {
            WebMirrorManager.getMirrorClient().stopMirror();
        }

        /* will stop share -> show dialog */
        function stopShare() {
            var dialog = document.getElementById('popup');
            dialog.style.display = 'flex';
        }

        /* Dialog Event: close dialog */
        function dialogCancel() {
            var dialog = document.getElementById('popup');
            dialog.style.display = 'none';
        }

        /* Dialog Event: confirm stop cast */
        function dialogConfirm() {
            var dialog = document.getElementById('popup');
            dialog.style.display = 'none';
            stopCast();
        }

        WebMirrorManager.getMirrorClient().onStart = () => {
            ds.share();
        }

        WebMirrorManager.getMirrorClient().onStop = () => {
            ds.disconnect();
        }

        WebMirrorManager.getMirrorClient().onError = () => {
            ds.disconnect();
        }

        window.addEventListener('offline', (event) => {
            ds.network();
        });

        window.addEventListener('online', (event) => {
            ds.disconnect();
        });
		
        // Firefox Safari show Start button
        // other browser auto start cast
        var browser = WebMirrorManager.getMirrorClient().deviceInfo.browserType;
        if (browser.includes('Firefox') || browser.includes('Safari')) {
            document.getElementById('state-ready').style.display = "block";
        } else {
            startCast();
        }
    }

</script>


</html>
